<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>えいご きいて えらぼう！</title>
<style>
  :root {
    --bg1: #fff6d6;
    --bg2: #d9f3ff;
    --ink: #3a2e1f;
    --main: #ff8a3d;
    --main-dark: #e0661a;
    --blue: #3db5ff;
    --green: #4cc96b;
    --red: #ff5a5a;
    --card: #ffffff;
    --u: min(1vw, 1.25dvh);   /* 画面に合わせた基準サイズ */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Meiryo", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 960px;
    margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }
  .screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .screen.active { display: flex; }

  button {
    font-family: inherit;
    color: inherit;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  .big-btn {
    font-size: clamp(22px, calc(var(--u) * 3.4), 36px);
    font-weight: 800;
    padding: 0.55em 1.4em;
    border-radius: 999px;
    background: var(--main);
    color: #fff;
    box-shadow: 0 6px 0 var(--main-dark);
    transition: transform .08s;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--main-dark); }
  .big-btn.sub { background: var(--blue); box-shadow: 0 6px 0 #1f8fd6; }
  .big-btn.sub:active { box-shadow: 0 2px 0 #1f8fd6; }

  /* ===== スタート画面 ===== */
  #start { align-items: center; justify-content: center; gap: clamp(10px, 3.2dvh, 34px); text-align: center; }
  .title {
    font-size: clamp(28px, calc(var(--u) * 5), 54px);
    font-weight: 900;
    color: var(--main);
    text-shadow: 3px 3px 0 #fff, 5px 5px 0 rgba(0,0,0,.08);
    line-height: 1.2;
  }
  .nw { white-space: nowrap; display: inline-block; }
  .lead { font-size: clamp(18px, calc(var(--u) * 2.8), 28px); font-weight: 700; }
  .themes {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(10px, 2.6dvh, 26px) clamp(12px, 2vw, 26px);
    width: 100%;
    max-width: 900px;
    padding: 0 8px;
  }
  .theme-btn {
    background: var(--card);
    border-radius: 22px;
    padding: clamp(6px, 1.8dvh, 18px) 4px;
    box-shadow: 0 6px 0 rgba(0,0,0,.12);
    display: flex; flex-direction: column; align-items: center; gap: clamp(2px, .8dvh, 8px);
    font-size: clamp(15px, calc(var(--u) * 2.2), 24px);
    white-space: nowrap;
    font-weight: 800;
    border: 4px solid transparent;
    transition: transform .08s;
  }
  .theme-btn .emo { font-size: clamp(28px, calc(var(--u) * 4.2), 50px); line-height: 1.1; }
  .theme-btn.all { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 12px; }
  .theme-btn.all .emo { font-size: clamp(24px, calc(var(--u) * 3.6), 40px); }
  .theme-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .warn { font-size: 16px; color: var(--red); font-weight: 700; }

  /* ===== 問題画面 ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: clamp(16px, calc(var(--u) * 2.4), 26px);
    font-weight: 800;
  }
  .home-btn {
    white-space: nowrap;
    background: #fff; border-radius: 999px; padding: .3em .8em;
    box-shadow: 0 3px 0 rgba(0,0,0,.12); font-size: inherit; font-weight: 800;
  }
  .dots { flex: 1; min-width: 0; display: flex; gap: clamp(3px, calc(var(--u) * .7), 8px); flex-wrap: wrap; justify-content: center; }
  .dot {
    width: clamp(12px, calc(var(--u) * 2), 22px); aspect-ratio: 1; border-radius: 50%;
    background: #fff; border: 3px solid #e0d6c4;
  }
  .dot.now { border-color: var(--main); transform: scale(1.2); }
  .dot.ok { background: var(--green); border-color: var(--green); }
  .dot.ng { background: #ffc2c2; border-color: #ffc2c2; }

  .prompt {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(12px, calc(var(--u) * 3), 36px);
    padding: clamp(6px, calc(var(--u) * 1.5), 18px) 0;
  }
  .speaker {
    width: clamp(78px, calc(var(--u) * 14), 150px);
    aspect-ratio: 1;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 7px 0 #1f8fd6;
    font-size: clamp(40px, calc(var(--u) * 7.5), 80px);
    display: flex; align-items: center; justify-content: center;
    transition: transform .08s;
  }
  .speaker:active { transform: translateY(5px); box-shadow: 0 2px 0 #1f8fd6; }
  .speaker.talking { animation: pulse .6s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }
  .words { min-width: 0; max-width: 100%; text-align: left; }
  .en {
    font-family: "Arial Rounded MT Bold", "Comic Sans MS", "Segoe UI", Arial, sans-serif;
    font-size: clamp(30px, calc(var(--u) * 6.5), 72px);
    font-weight: 900;
    line-height: 1.1;
    overflow-wrap: anywhere;
  }
  .ja {
    font-size: clamp(20px, calc(var(--u) * 3.4), 38px);
    font-weight: 800;
    color: var(--main-dark);
    min-height: 1.4em;
  }
  .ja.hidden { visibility: hidden; }
  .hint { font-size: clamp(14px, calc(var(--u) * 2), 20px); font-weight: 700; color: #8a7a62; }

  .choices {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: clamp(10px, calc(var(--u) * 2), 22px);
    padding-bottom: clamp(6px, calc(var(--u) * 1.2), 14px);
  }
  .choice {
    position: relative;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 7px 0 rgba(0,0,0,.12);
    border: 5px solid #ffe2a8;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(54px, min(calc(var(--u) * 12), 15dvh), 130px);
    line-height: 1;
    min-height: 0;
    transition: transform .08s, opacity .2s;
  }
  .choice:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: var(--green); background: #eaffe9; }
  .choice.wrong { border-color: var(--red); background: #ffecec; }
  .choice.dim { opacity: .45; }
  .choice .mark {
    position: absolute; top: 6px; right: 10px;
    font-size: clamp(26px, calc(var(--u) * 5), 52px);
  }
  .choice.shake { animation: shake .4s; }
  @keyframes shake {
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  .bottom { display: flex; justify-content: center; align-items: center; min-height: clamp(56px, calc(var(--u) * 9), 90px); }
  .bottom .big-btn { visibility: hidden; }
  .bottom .big-btn.show { visibility: visible; animation: pop .3s; }

  /* はなまる */
  .hanamaru {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
  }
  .hanamaru.show { animation: hanamaru 1.4s ease-out forwards; }
  .hanamaru svg { width: min(60vw, 52dvh); height: auto; filter: drop-shadow(0 6px 8px rgba(0,0,0,.15)); }
  .hanamaru .great {
    font-family: "Arial Rounded MT Bold", "Comic Sans MS", Arial, sans-serif;
    font-size: clamp(44px, calc(var(--u) * 10), 110px);
    font-weight: 900; color: var(--red);
    text-shadow: 4px 4px 0 #fff;
    margin-top: -0.4em;
  }
  @keyframes hanamaru {
    0% { opacity: 0; transform: scale(.3) rotate(-30deg); }
    25% { opacity: 1; transform: scale(1.08) rotate(0); }
    35% { transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(1); }
  }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }

  /* ===== 結果画面 ===== */
  #result { align-items: center; justify-content: center; text-align: center; gap: clamp(8px, calc(var(--u) * 2), 22px); }
  .result-title { font-size: clamp(28px, calc(var(--u) * 5), 56px); font-weight: 900; color: var(--main); }
  .score {
    font-size: clamp(64px, calc(var(--u) * 16), 180px);
    font-weight: 900; line-height: 1;
    color: var(--red);
    text-shadow: 4px 4px 0 #fff;
  }
  .score small { font-size: .4em; color: var(--ink); }
  .stars { font-size: clamp(36px, calc(var(--u) * 7), 76px); letter-spacing: .1em; }
  .message { font-size: clamp(20px, calc(var(--u) * 3.4), 36px); font-weight: 800; }
  .result-btns { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

  /* ===== 設定画面 ===== */
  #start { position: relative; }
  .gear-btn {
    position: absolute; top: 0; right: 0;
    width: 60px; height: 60px; border-radius: 50%;
    background: #fff; font-size: 32px;
    box-shadow: 0 4px 0 rgba(0,0,0,.12);
  }
  .gear-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.12); }
  #settings { gap: 12px; }
  .set-title { font-size: clamp(20px, calc(var(--u) * 3.2), 32px); font-weight: 900; text-align: center; }
  .set-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .set-label { font-size: 20px; font-weight: 900; min-width: 3.5em; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button {
    font-size: 18px; font-weight: 800; padding: .45em .9em; border-radius: 999px;
    background: #fff; border: 3px solid #ffe2a8; box-shadow: 0 3px 0 rgba(0,0,0,.1);
  }
  .seg button.on { background: var(--main); border-color: var(--main); color: #fff; }
  .check { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .check input { width: 24px; height: 24px; accent-color: var(--main); }
  .voice-list {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
    padding: 4px 4px 8px;
    -webkit-overflow-scrolling: touch;
  }
  .voice-item {
    display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center;
    text-align: left; background: #fff; border-radius: 18px; padding: 10px 16px;
    border: 3px solid #ffe2a8; box-shadow: 0 3px 0 rgba(0,0,0,.08);
  }
  .voice-item.on { border-color: var(--main); background: #fff3e6; }
  .voice-item .radio {
    grid-row: span 2; width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid #d8c8ad; background: #fff;
  }
  .voice-item.on .radio { border-color: var(--main); background: radial-gradient(var(--main) 45%, #fff 50%); }
  .vname { font-size: 19px; font-weight: 800; overflow-wrap: anywhere; }
  .vsub { font-size: 14px; color: #8a7a62; font-weight: 700; }
  .set-note { font-size: 14px; color: #8a7a62; font-weight: 700; }

  /* ===== カレンダー（けいさんアプリと おなじ しくみ・みため） ===== */
  .start-layout { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .start-main { width: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 3.2dvh, 34px); }
  .calendar {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 24px;
    padding: 12px 12px 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    text-align: left;
    --cell: 42px;
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-title { font-size: 22px; font-weight: bold; }
  .cal-nav { width: 52px; height: 40px; padding: 0; font-size: 18px; border-radius: 14px; background: var(--main); color: #fff; font-weight: bold; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
  .cal-week { margin-bottom: 3px; }
  .cal-week span { font-size: 14px; font-weight: bold; color: #888; }
  .cal-week .sun, .cal-day.sun .cal-num { color: #e03131; }
  .cal-week .sat, .cal-day.sat .cal-num { color: #1c7ed6; }
  .cal-day {
    position: relative;
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .cal-day.future .cal-num { opacity: .4; }
  .cal-day.today { background: #ffe8cc; box-shadow: inset 0 0 0 3px var(--main); }
  .cal-day.today .cal-num { color: #d9480f; font-size: 20px; }
  .cal-day.picked { box-shadow: inset 0 0 0 2px #adb5bd; }
  .cal-day.today.picked { box-shadow: inset 0 0 0 3px var(--main); }
  .cal-num { position: relative; z-index: 1; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; }
  .cal-mark { position: absolute; inset: 1px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .cal-mark svg { height: 100%; width: 100%; }
  .cal-info { margin-top: 8px; min-height: 1.4em; font-size: 18px; font-weight: bold; text-align: center; color: #d9480f; }
  .cal-legend { margin-top: 4px; display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 14px; color: #777; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .cal-legend svg { width: 22px; height: 22px; }

  /* せまい がめん：カレンダー は テーマ の した。スクロール して みる */
  @media (max-width: 859px) {
    #start { justify-content: flex-start; overflow-y: auto; padding-bottom: 16px; -webkit-overflow-scrolling: touch; }
    #start > .title { margin-top: 8px; }
  }

  /* スマホ縦 */
  @media (max-aspect-ratio: 3/4) {
    :root { --u: min(1.6vw, 1dvh); }
    .themes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .themes { gap: clamp(8px, 1.8dvh, 16px) 12px; padding: 0 4px; }
    .theme-btn { font-size: 15px; padding: clamp(5px, 1.2dvh, 10px) 2px; border-radius: 18px; }
    .theme-btn .emo { font-size: clamp(28px, 4.6dvh, 38px); }
    #start { gap: clamp(10px, 2.2dvh, 22px); padding-top: 52px; }
    .title { font-size: clamp(24px, 7vw, 30px); }
    .dot { width: 11px; border-width: 2px; }
    .home-btn { padding: .3em .6em; }
    .set-title { font-size: 18px; }
    #settings .home-btn { font-size: 16px; }
    .seg button { font-size: 16px; padding: .4em .7em; }
    .set-label { min-width: 0; font-size: 18px; }
    .prompt { flex-direction: column; gap: 8px; }
    .words { text-align: center; }
    .choice { font-size: clamp(54px, min(22vw, 13dvh), 120px); border-radius: 22px; }
    .big-btn { font-size: 24px; }
  }
  /* ひろい パソコン：ひだり に テーマ、みぎ に カレンダー（1がめん に おさめる） */
  @media (min-width: 860px) {
    body.on-start .app { max-width: 1180px; }
    .start-layout { display: grid; grid-template-columns: 1.3fr 1fr; gap: 36px; align-items: center; }
    #start { gap: clamp(8px, 2.4dvh, 26px); }
    .start-main { gap: clamp(8px, 2.4dvh, 26px); }
    .themes { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: none; padding: 0; gap: clamp(8px, 2dvh, 20px) 14px; }
    .theme-btn { padding: clamp(4px, 1.4dvh, 14px) 2px; font-size: clamp(15px, 2.6dvh, 22px); }
    .theme-btn .emo { font-size: clamp(26px, 5dvh, 46px); }
    .calendar { max-width: none; --cell: 38px; }
  }
  @media (min-width: 860px) and (min-height: 700px) {
    .calendar { padding: 14px 16px 12px; --cell: 46px; }
  }
  @media (min-width: 860px) and (min-height: 800px) {
    .calendar { --cell: 52px; }
    .cal-day { font-size: 20px; }
  }
  @media (min-width: 860px) and (min-height: 900px) {
    .calendar { padding: 18px 18px 14px; --cell: 58px; }
    .cal-grid { gap: 4px; }
  }
</style>
</head>
<body class="on-start">
<div class="app">

  <!-- スタート -->
  <section id="start" class="screen active">
    <h1 class="title"><span class="nw">🎧 えいご きいて</span> <span class="nw">えらぼう！</span></h1>
    <button class="gear-btn" id="gearBtn" aria-label="こえの せってい">⚙️</button>
    <div class="start-layout">
      <div class="start-main">
        <p class="lead">テーマを えらんでね</p>
        <div class="themes" id="themes"></div>
        <p class="warn" id="noSpeech" hidden>このブラウザでは おとが でません。Chrome や Safari で ひらいてね。</p>
      </div>

      <!-- カレンダー -->
      <div class="calendar">
        <div class="cal-head">
          <button class="cal-nav" id="calPrev" aria-label="まえ の つき">◀</button>
          <div class="cal-title" id="calTitle"></div>
          <button class="cal-nav" id="calNext" aria-label="つぎ の つき">▶</button>
        </div>
        <div class="cal-grid cal-week">
          <span class="sun">にち</span><span>げつ</span><span>か</span><span>すい</span><span>もく</span><span>きん</span><span class="sat">ど</span>
        </div>
        <div class="cal-grid" id="calDays"></div>
        <div class="cal-info" id="calInfo"></div>
        <div class="cal-legend" id="calLegend"></div>
      </div>
    </div>
  </section>

  <!-- 設定 -->
  <section id="settings" class="screen">
    <div class="topbar">
      <button class="home-btn" id="settingsBack">◀ もどる</button>
      <div class="set-title">⚙️ こえの せってい</div>
      <button class="home-btn" id="testVoice">🔊 きく</button>
    </div>
    <div class="set-row">
      <span class="set-label">はやさ</span>
      <div class="seg" id="rateBtns">
        <button data-rate="slow">🐢 ゆっくり</button>
        <button data-rate="normal">🚶 ふつう</button>
        <button data-rate="fast">🐇 はやい</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label">こえ</span>
      <label class="check"><input type="checkbox" id="showAll"> ほかの えいごの こえも みる</label>
    </div>
    <div class="voice-list" id="voiceList"></div>
    <p class="set-note">★ は しぜんな こえ（Natural・Google・高品質）です。えらぶと おためしで よみあげます。</p>
  </section>

  <!-- 問題 -->
  <section id="quiz" class="screen">
    <div class="topbar">
      <button class="home-btn" id="homeBtn">🏠 もどる</button>
      <div class="dots" id="dots"></div>
      <div id="counter">1/10</div>
    </div>

    <div class="prompt">
      <button class="speaker" id="speakerBtn" aria-label="もういちど きく">🔊</button>
      <div class="words">
        <div class="en" id="enText">Hello</div>
        <div class="ja hidden" id="jaText">こんにちは</div>
        <div class="hint" id="hintText">🔊を おすと なんども きけるよ</div>
      </div>
    </div>

    <div class="choices" id="choices"></div>

    <div class="bottom">
      <button class="big-btn" id="nextBtn">つぎへ ▶</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="screen">
    <div class="result-title">おしまい！</div>
    <div class="score" id="score">10<small> / 10もん</small></div>
    <div class="stars" id="stars"></div>
    <div class="message" id="message"></div>
    <div class="result-btns">
      <button class="big-btn" id="retryBtn">🔁 もういちど</button>
      <button class="big-btn sub" id="toHomeBtn">🏠 テーマを えらぶ</button>
    </div>
  </section>
</div>

<!-- はなまる -->
<div class="hanamaru" id="hanamaru">
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <g fill="none" stroke="#ff4b4b" stroke-width="7" stroke-linecap="round">
      <!-- 花びら -->
      <g id="petals"></g>
      <!-- うずまき -->
      <path d="M100 100 m-8 0 a8 8 0 1 0 16 0 a14 14 0 1 0 -28 0 a22 22 0 1 0 44 0 a30 30 0 1 0 -60 0 a38 38 0 1 0 76 0"/>
    </g>
  </svg>
  <div class="great">Great!</div>
</div>

<script>
// ===== データ =====

// ===== 音声 =====
const synth = window.speechSynthesis;
const SETTINGS_KEY = "eigo-kiite-settings";
const RATES = { slow: 0.7, normal: 0.85, fast: 1.0 };
let settings = { voiceURI: "auto", rate: "normal", showAll: false };
try {
  Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {});
} catch (e) { /* 保存できない環境でも動くように */ }
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
}

// macOS のおもしろ声など、学習に向かない声
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Kathy|Fred|Grandma|Grandpa|Rocko|Eddy|Flo|Reed|Sandy|Shelley/i;

const isUS = v => /^en[-_]US$/i.test(v.lang);

// 声の「自然さ」の点数（高いほど自然）
function voiceScore(v) {
  const n = v.name;
  let s = 0;
  if (/Natural/i.test(n)) s += 100;           // Microsoft Edge の Natural 音声
  if (/Neural/i.test(n)) s += 90;
  if (/Google/i.test(n)) s += 80;             // Chrome の Google US English
  if (/Premium/i.test(n)) s += 75;            // macOS / iOS の高品質音声
  if (/Enhanced|拡張/i.test(n)) s += 60;
  if (/Siri/i.test(n)) s += 50;
  if (/Online/i.test(n)) s += 20;
  if (/^(Ava|Allison|Susan|Zoe|Evan|Nathan|Tom|Joelle|Noelle|Samantha)\b/i.test(n)) s += 30;
  if (/Aria|Jenny|Guy|Ana|Michelle|Emma|Brian|Andrew|Ava/i.test(n) && /Microsoft/i.test(n)) s += 15;
  if (NOVELTY.test(n)) s -= 200;
  if (isUS(v)) s += 40;
  return s;
}

function englishVoices() {
  if (!synth) return [];
  return synth.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang));
}
function usVoices() { return englishVoices().filter(isUS); }

function bestVoice() {
  const pool = usVoices().length ? usVoices() : englishVoices();
  return pool.slice().sort((a, b) => voiceScore(b) - voiceScore(a))[0] || null;
}

function currentVoice() {
  if (settings.voiceURI !== "auto") {
    const v = englishVoices().find(v => v.voiceURI === settings.voiceURI);
    if (v) return v;
  }
  return bestVoice();
}

function speak(text, { rate, onend } = {}) {
  if (!synth) { onend && onend(); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const voice = currentVoice();
  u.lang = voice ? voice.lang : "en-US";
  if (voice) u.voice = voice;
  u.rate = rate ?? RATES[settings.rate] ?? 0.85;
  u.pitch = 1.05;
  u.onend = u.onerror = () => onend && onend();
  synth.speak(u);
}

if (synth) {
  synth.getVoices();
  synth.addEventListener?.("voiceschanged", () => {
    if ($("settings").classList.contains("active")) renderSettings();
  });
}

// ===== 設定画面 =====
let screenBeforeSettings = "start";
const SAMPLE = "Hello! I like apples. Let's play!";

function openSettings() {
  screenBeforeSettings = document.querySelector(".screen.active").id;
  synth && synth.cancel();
  renderSettings.retry = 0;
  renderSettings();
  show("settings");
}

function renderSettings() {
  renderSettings.retry ??= 0;
  document.querySelectorAll("#rateBtns button").forEach(b =>
    b.classList.toggle("on", b.dataset.rate === settings.rate));
  $("showAll").checked = settings.showAll;

  const list = $("voiceList");
  list.innerHTML = "";
  const best = bestVoice();
  const voices = (settings.showAll ? englishVoices() : usVoices())
    .slice().sort((a, b) => voiceScore(b) - voiceScore(a));

  const addItem = (uri, title, sub, star) => {
    const b = document.createElement("button");
    b.className = "voice-item" + (settings.voiceURI === uri ? " on" : "");
    b.innerHTML = `<span class="radio"></span><span class="vname"></span><span class="vsub"></span>`;
    b.querySelector(".vname").textContent = (star ? "★ " : "") + title;
    b.querySelector(".vsub").textContent = sub;
    b.onclick = () => {
      settings.voiceURI = uri;
      saveSettings();
      renderSettings();
      speak(SAMPLE);
    };
    list.appendChild(b);
  };

  addItem("auto", "おまかせ（いちばん しぜんな こえ）",
    best ? `いまは「${best.name}」` : "こえを さがしています…", false);

  if (!voices.length) {
    // 声の読みこみが おそいブラウザでは、少しあとで もういちど
    if (synth && renderSettings.retry++ < 10) setTimeout(() => {
      if ($("settings").classList.contains("active")) renderSettings();
    }, 500);
    const p = document.createElement("p");
    p.className = "set-note";
    p.textContent = synth
      ? "アメリカえいごの こえが みつかりません。「ほかの えいごの こえも みる」を ためしてね。"
      : "このブラウザでは よみあげが つかえません。";
    list.appendChild(p);
  }
  voices.forEach(v => addItem(v.voiceURI, v.name,
    `${v.lang}${v.localService ? "" : "・オンライン"}`, voiceScore(v) >= 100));
}

// ===== きろく（ブラウザ に ほぞん して、とじても きえない）=====
// けいさんアプリ とは べつ の なまえ で ほぞん するので、かず は べつべつ
const RECORD_KEY = "eigo-kiite-records";
const MARU_COUNT = 10;     // この かず いじょう で ○
const HANAMARU_COUNT = 20; // この かず いじょう で はなまる

function loadRecords() {
  try {
    const data = JSON.parse(localStorage.getItem(RECORD_KEY));
    return data && typeof data === "object" && !Array.isArray(data) ? data : {};
  } catch (e) {
    return {};
  }
}
let records = loadRecords();

const pad2 = n => String(n).padStart(2, "0");
const dateKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const countOf = key => Number(records[key]) || 0;

// こたえる たび に、その日 の かず を 1 ふやす
function addRecord() {
  records = loadRecords(); // べつ の タブ で ふえた ぶん も いかす
  const key = dateKey(new Date());
  records[key] = countOf(key) + 1;
  try { localStorage.setItem(RECORD_KEY, JSON.stringify(records)); } catch (e) { /* ほぞん できなくても つづける */ }
}

// ===== カレンダー =====
const MARU_SVG =
  '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="41" fill="none" stroke="#f03e3e" stroke-width="7"/></svg>';
const HANAMARU_SVG = (() => {
  // まわり の はなびら
  const N = 10, R = 38, r = 12;
  const pt = i => {
    const a = (i / N) * Math.PI * 2 - Math.PI / 2;
    return `${(50 + R * Math.cos(a)).toFixed(1)} ${(50 + R * Math.sin(a)).toFixed(1)}`;
  };
  let petals = `M${pt(0)}`;
  for (let i = 1; i <= N; i++) petals += ` A${r} ${r} 0 0 1 ${pt(i)}`;
  // なか の ぐるぐる（まんなか の すうじ に かからない ように そと がわ だけ）
  let spiral = "";
  for (let i = 0; i <= 80; i++) {
    const t = i / 80;
    const a = -Math.PI / 2 + t * Math.PI * 2 * 1.75;
    const rr = 31 - t * 9;
    spiral += `${i ? " L" : "M"}${(50 + rr * Math.cos(a)).toFixed(1)} ${(50 + rr * Math.sin(a)).toFixed(1)}`;
  }
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#f03e3e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">' +
    `<path d="${petals}" fill="#fff0f6"/><path d="${spiral}" fill="none"/></g></svg>`;
})();
const markOf = n => n >= HANAMARU_COUNT ? HANAMARU_SVG : n >= MARU_COUNT ? MARU_SVG : "";

let calYear, calMonth, calPicked = null;

function resetCalendar() {
  const now = new Date();
  records = loadRecords();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  calPicked = null;
  renderCalendar();
}

function renderCalendar() {
  const todayKey = dateKey(new Date());
  $("calTitle").textContent = `${calYear}ねん ${calMonth + 1}がつ`;
  const first = new Date(calYear, calMonth, 1).getDay();
  const days = new Date(calYear, calMonth + 1, 0).getDate();
  let html = "";
  for (let i = 0; i < first; i++) html += "<div></div>";
  for (let d = 1; d <= days; d++) {
    const key = `${calYear}-${pad2(calMonth + 1)}-${pad2(d)}`;
    const wd = (first + d - 1) % 7;
    const cls = ["cal-day",
      wd === 0 ? "sun" : wd === 6 ? "sat" : "",
      key === todayKey ? "today" : "",
      key > todayKey ? "future" : "",
      key === calPicked ? "picked" : ""].join(" ");
    html += `<div class="${cls}" data-date="${key}">` +
      `<span class="cal-mark">${markOf(countOf(key))}</span><span class="cal-num">${d}</span></div>`;
  }
  $("calDays").innerHTML = html;
  renderCalInfo();
}

function renderCalInfo() {
  const todayKey = dateKey(new Date());
  const key = calPicked || todayKey;
  const n = countOf(key);
  let text;
  if (key === todayKey) {
    text = n >= HANAMARU_COUNT ? `きょう は ${n}もん！ はなまる 🎉`
         : n >= MARU_COUNT ? `きょう は ${n}もん！ あと ${HANAMARU_COUNT - n}もん で はなまる`
         : `きょう は ${n}もん。あと ${MARU_COUNT - n}もん で ○`;
  } else {
    const [, m, d] = key.split("-").map(Number);
    text = key > todayKey ? `${m}がつ ${d}にち は まだ だよ`
         : `${m}がつ ${d}にち は ${n}もん` + (n >= HANAMARU_COUNT ? " はなまる" : n >= MARU_COUNT ? " ○" : "");
  }
  $("calInfo").textContent = text;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function poolFor(key) {
  if (key === ALL_KEY) {
    return Object.values(THEMES).flatMap(t => t.items.map(it => ({ ...it, group: t })));
  }
  return THEMES[key].items.map(it => ({ ...it, group: THEMES[key] }));
}

function buildQuestions(key) {
  const pool = poolFor(key);
  let picks = shuffle(pool).slice(0, QUESTIONS);
  while (picks.length < QUESTIONS) picks.push(pool[Math.floor(Math.random() * pool.length)]);
  return picks.map(answer => {
    // まちがいの選択肢は同じテーマから選ぶ
    const others = shuffle(answer.group.items.filter(it => it.pic !== answer.pic && it.en !== answer.en))
      .slice(0, CHOICES - 1);
    return { answer, options: shuffle([answer, ...others]) };
  });
}

// ===== スタート画面 =====
const THEME_COLORS = ["#ffb3c7", "#ffd36b", "#ff9f6b", "#9fd8ff", "#a6e8a0", "#d7b3ff"];
function renderThemes() {
  const box = $("themes");
  const entries = [...Object.entries(THEMES), [ALL_KEY, { name: "ぜんぶ", emo: "🌈" }]];
  let i = 0;
  for (const [key, t] of entries) {
    const b = document.createElement("button");
    b.className = "theme-btn" + (key === ALL_KEY ? " all" : "");
    b.style.borderColor = THEME_COLORS[i++ % THEME_COLORS.length];
    b.innerHTML = `<span class="emo">${t.emo}</span>${t.name}`;
    b.onclick = () => startQuiz(key);
    box.appendChild(b);
  }
  if (!synth) $("noSpeech").hidden = false;
}

function startQuiz(key) {
  themeKey = key;
  questions = buildQuestions(key);
  index = 0;
  score = 0;
  results = [];
  show("quiz");
  showQuestion();
}

// ===== 問題画面 =====
function renderDots() {
  const box = $("dots");
  box.innerHTML = "";
  for (let i = 0; i < QUESTIONS; i++) {
    const d = document.createElement("span");
    d.className = "dot" + (i === index ? " now" : "") +
      (results[i] === true ? " ok" : results[i] === false ? " ng" : "");
    box.appendChild(d);
  }
  $("counter").textContent = `${index + 1}/${QUESTIONS}`;
}

function showQuestion() {
  answered = false;
  const q = questions[index];
  renderDots();
  $("enText").textContent = q.answer.en;
  $("jaText").textContent = q.answer.ja;
  $("jaText").classList.add("hidden");
  $("hintText").textContent = "🔊を おすと なんども きけるよ";
  $("nextBtn").classList.remove("show");

  const box = $("choices");
  box.innerHTML = "";
  q.options.forEach(opt => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = opt.pic;
    b.setAttribute("aria-label", opt.ja);
    b.onclick = () => choose(b, opt);
    box.appendChild(b);
  });
  playWord();
}

function playWord() {
  const btn = $("speakerBtn");
  btn.classList.add("talking");
  speak(questions[index].answer.en, { onend: () => btn.classList.remove("talking") });
}

function addMark(btn, text) {
  const m = document.createElement("span");
  m.className = "mark";
  m.textContent = text;
  btn.appendChild(m);
}

function choose(btn, opt) {
  if (answered) return;
  const q = questions[index];
  const ok = opt.pic === q.answer.pic;
  answered = true;
  results[index] = ok;
  addRecord();
  $("jaText").classList.remove("hidden");

  const buttons = [...$("choices").children];
  buttons.forEach((b, i) => {
    b.disabled = true;
    const isAnswer = q.options[i].pic === q.answer.pic;
    if (isAnswer) { b.classList.add("correct"); addMark(b, "⭕"); }
    else if (b !== btn) b.classList.add("dim");
  });

  if (ok) {
    score++;
    $("hintText").textContent = "せいかい！ すごいね！";
    showHanamaru();
    speak("Great!");
  } else {
    btn.classList.add("wrong", "shake");
    addMark(btn, "❌");
    $("hintText").textContent = "おしい！ こたえは ⭕ だよ";
    speak(q.answer.en);
  }
  renderDots();
  $("nextBtn").textContent = index + 1 < QUESTIONS ? "つぎへ ▶" : "けっかを みる ▶";
  $("nextBtn").classList.add("show"); // おせば またずに すすめる
  autoNextTimer = setTimeout(next, ok ? AUTO_NEXT_MS.correct : AUTO_NEXT_MS.wrong);
}

function showHanamaru() {
  const el = $("hanamaru");
  el.classList.remove("show");
  void el.offsetWidth; // アニメーションを最初から
  el.classList.add("show");
}

function next() {
  clearTimeout(autoNextTimer);
  if (!answered) return;
  index++;
  if (index < QUESTIONS) showQuestion();
  else showResult();
}

// ===== 結果画面 =====
function showResult() {
  show("result");
  $("score").innerHTML = `${score}<small> / ${QUESTIONS}もん</small>`;
  const starCount = score >= 10 ? 3 : score >= 7 ? 2 : score >= 4 ? 1 : 0;
  $("stars").textContent = "⭐".repeat(starCount) + "☆".repeat(3 - starCount);
  let msg, voice;
  if (score === QUESTIONS) { msg = "ぜんもん せいかい！ てんさい！🎉"; voice = "Perfect! Excellent!"; }
  else if (score >= 7)     { msg = "とっても よくできました！"; voice = "Great job!"; }
  else if (score >= 4)     { msg = "よくできました！ またやってみよう"; voice = "Good job!"; }
  else                     { msg = "がんばったね！ もういちど やってみよう"; voice = "Nice try!"; }
  $("message").textContent = msg;
  speak(voice);
  if (score === QUESTIONS) showHanamaru();
}

// ===== はなまるの花びらを描く =====
(function drawPetals() {
  const g = document.getElementById("petals");
  const n = 12, r = 62, pr = 22;
  let html = "";
  for (let i = 0; i < n; i++) {
    const a1 = (i / n) * Math.PI * 2, a2 = ((i + 1) / n) * Math.PI * 2;
    const x1 = 100 + r * Math.cos(a1), y1 = 100 + r * Math.sin(a1);
    const x2 = 100 + r * Math.cos(a2), y2 = 100 + r * Math.sin(a2);
    html += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${pr} ${pr} 0 1 1 ${x2.toFixed(1)} ${y2.toFixed(1)}"/>`;
  }
  g.innerHTML = html;
})();

// ===== イベント =====
$("speakerBtn").onclick = playWord;
$("nextBtn").onclick = next;
$("homeBtn").onclick = () => { clearTimeout(autoNextTimer); synth && synth.cancel(); show("start"); };
$("retryBtn").onclick = () => startQuiz(themeKey);
$("toHomeBtn").onclick = () => show("start");
$("gearBtn").onclick = openSettings;
$("settingsBack").onclick = () => { synth && synth.cancel(); show(screenBeforeSettings); };
$("testVoice").onclick = () => speak(SAMPLE);
$("showAll").onchange = e => { settings.showAll = e.target.checked; saveSettings(); renderSettings(); };
document.querySelectorAll("#rateBtns button").forEach(b => b.onclick = () => {
  settings.rate = b.dataset.rate; saveSettings(); renderSettings(); speak(SAMPLE);
});

$("calLegend").innerHTML =
  `<span>${MARU_SVG} ${MARU_COUNT}もん いじょう</span><span>${HANAMARU_SVG} ${HANAMARU_COUNT}もん いじょう</span>`;
$("calPrev").onclick = () => {
  if (--calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
};
$("calNext").onclick = () => {
  if (++calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
};
$("calDays").onclick = e => {
  const day = e.target.closest(".cal-day");
  if (!day) return;
  calPicked = calPicked === day.dataset.date ? null : day.dataset.date;
  renderCalendar();
};
resetCalendar();

renderThemes();
</script>
